name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit test parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-scapy
      - name: Run unit tests
        run: python3 test_parser.py

  e2e:
    name: Test suite end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-scapy nftables iproute2
      - name: Run end-to-end tests
        run: |
          sudo python3 -m pip install --break-system-packages scapy
          sudo python3 test_suite.py

  diagram:
    name: Diagram README sinkron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check diagram is in sync
        run: python3 tools/sync_diagram.py --check

  ui:
    name: Test UI dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-scapy
          python3 -m pip install --break-system-packages playwright
          python3 -m playwright install --with-deps chromium
      - name: Run UI tests
        run: python3 tools/ui_test.py --serve


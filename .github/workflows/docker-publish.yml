name: Publish image ke GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Nama image harus lowercase; GITHUB_REPOSITORY bisa mengandung huruf besar.
      - name: Tentukan nama image
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Hitung tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=netcut-linux
            org.opencontainers.image.description=Monitor bandwidth per host & kontrol trafik jaringan lokal
            org.opencontainers.image.licenses=MIT

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verifikasi nyata: image yang baru dipush harus bisa di-pull dan jalan.
      - name: Smoke test hasil push
        run: |
          set -euo pipefail
          REF=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          echo "pull: $REF"
          docker pull "$REF"
          echo "--- entrypoint ---"
          docker run --rm --entrypoint python3 "$REF" /app/netcut.py --help | head -5
          echo "--- database OUI di dalam image ---"
          docker run --rm --entrypoint sh "$REF" -c \
            'wc -l < /usr/share/hwdata/oui.txt; command -v nft; python3 -c "import scapy; print(\"scapy\", scapy.__version__)"'

# netcut-linux via Docker
#
#   docker compose up -d            -> build dari source ini, lalu jalankan
#   docker compose pull             -> ambil image jadi dari GHCR (tanpa build)
#
#   docker compose logs -f
#   docker compose down
#
# network_mode host WAJIB: ARP spoofing & relay harus bekerja pada interface
# host yang asli. Tanpa itu container ada di netns sendiri dan tidak melihat
# LAN sama sekali. Konsekuensinya Linux saja (Docker Desktop macOS/Windows
# memakai jaringan di dalam VM).

services:
  netcut:
    image: ghcr.io/aryoksss/netcut-linux:latest
    build: .
    container_name: netcut
    network_mode: host
    cap_add:
      - NET_RAW     # capture paket + ARP scan
      - NET_ADMIN   # aturan nftables
    # port dashboard (pakai --network=host, jadi port-nya bukan publish)
    command: ["--web", "--web-port", "8080"]
    restart: unless-stopped
